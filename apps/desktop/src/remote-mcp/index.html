<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; form-action 'none'; frame-src 'none'; base-uri 'none'">
<title>远程 MCP 管理</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>远程插件</h1>
<p>添加一个只读插件。密钥只保存在这台电脑上，每次使用仍会在对话里请你确认。</p>
<p id="status" role="status"></p><p id="error" role="alert"></p>
<section><h2>已添加的插件</h2><label for="server">当前插件</label><select id="server"></select>
<label for="server-id">名称（小写字母、数字、短横线）</label><input id="server-id" type="text" autocomplete="off" maxlength="64" placeholder="例如 notes">
<button id="new-server">添加</button>
<details><summary>从旧版本搬过来</summary><button id="migrate-server">搬移旧配置</button></details></section>
<section><h2>插件说明</h2><p>选择已经准备好的插件文件，不用手写配置。</p>
<button id="import">选择插件文件</button><p id="definition">还没有选择插件文件。</p>
<form id="save-form"><label for="token">访问令牌（没有就留空）</label>
<input id="token" type="password" autocomplete="off" spellcheck="false" maxlength="8192">
<label for="expires-picker">令牌到期</label>
<input id="expires-picker" type="datetime-local">
<input id="expires" type="text" hidden autocomplete="off">
<button type="submit" id="save">保存</button></form>
<p id="restart-note"></p></section>
<section><h2>连接</h2><button id="connect">连接</button><button id="disconnect">断开</button><button id="revoke">删除这个插件</button></section>
<section><h2>使用一次</h2><p>提出后回到对话里同意或拒绝。没有额外条件就留空。</p>
<form id="run-form"><div id="argument-fields"></div><label for="arguments">补充条件</label><textarea id="arguments" rows="3" placeholder="一般留空"></textarea><button id="submit" type="submit">提出申请</button></form>
<div id="tasks"></div><p id="task-result" hidden></p><p id="question-notice" hidden>请回到对话里处理这次请求。</p><button id="review-question" disabled>去对话里处理</button><button id="cancel" disabled>停止</button></section>
</main><script type="module" src="view.js"></script></body></html>
