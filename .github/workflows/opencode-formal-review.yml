name: OpenCode formal review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/opencode-formal-review.yml'
      - 'scripts/review/opencode-formal-*.mjs'
      - 'scripts/ci/opencode-formal-review.test.mjs'
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Public same-repository PR number to review'
        required: true
        type: string

permissions: {}
concurrency:
  group: opencode-formal-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name == 'pull_request' && 'smoke' || 'publish' }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
      - name: Install fixed official OpenCode binary without lifecycle scripts
        working-directory: ${{ runner.temp }}
        run: npm install --prefix "$RUNNER_TEMP/opencode-cli" --registry https://registry.npmjs.org --ignore-scripts --no-audit --no-fund opencode-linux-x64-baseline@1.19.3
      - name: Real free-model smoke on explicitly synthetic source (no GitHub writes)
        run: node scripts/review/opencode-formal-smoke.mjs "$RUNNER_TEMP/opencode-cli/node_modules/opencode-linux-x64-baseline/bin/opencode"

  review:
    if: github.repository == 'xianxing-ai/PersonalAgent' && (github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.review.outputs.ready }}
    steps:
      # github.sha is trusted main for both permitted events, never PR head.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/review
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
      - name: Install fixed official OpenCode binary without lifecycle scripts
        working-directory: ${{ runner.temp }}
        run: npm install --prefix "$RUNNER_TEMP/opencode-cli" --registry https://registry.npmjs.org --ignore-scripts --no-audit --no-fund opencode-linux-x64-baseline@1.19.3
      - name: Collect immutable source and run isolated model
        id: review
        run: node scripts/review/opencode-formal-runner.mjs review "$RUNNER_TEMP/review.json" "$RUNNER_TEMP/opencode-cli/node_modules/opencode-linux-x64-baseline/bin/opencode"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.review.outputs.ready == 'true'
        with:
          name: opencode-formal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: review
    if: needs.review.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/review
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
      # No run-id/repository override: download only this run's fixed producer artifact.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-formal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/opencode-result
      - name: Verify source again, submit formal review, read actual receipt
        run: node scripts/review/opencode-formal-runner.mjs publish "$RUNNER_TEMP/opencode-result/review.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
