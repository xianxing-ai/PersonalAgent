name: Approved PR auto-merge
on:
  workflow_run:
    workflows: [Foundation, ECS Linux CI, Design review approval, DeepSeek template offline]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
concurrency:
  group: approved-pr-auto-merge
  cancel-in-progress: false
jobs:
  merge-approved:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Merge only approved current-head PRs with green Windows and ECS CI
        run: node scripts/review/auto-merge.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
