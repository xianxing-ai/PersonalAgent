name: ECS Linux CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecs-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ecs-linux-check:
    name: ecs-linux-check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, personalagent-ecs]
    env:
      PATH: /opt/personalagent-review/toolchain/node/bin:/usr/local/bin:/usr/bin:/bin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the ECS toolchain matches the repository
        shell: bash
        run: |
          test "$(node --version)" = "v$(tr -d '\r\n' < .node-version)"
          test "$(npm --version)" = '11.12.1'
          uname -a
      - name: Install dependencies for headless checks
        run: npm ci --ignore-scripts
      - name: Build, type-check and test on the ECS
        run: npm run check
      - name: Verify the approval and automatic merge gates
        run: node --test scripts/review/design-review.test.mjs scripts/review/auto-merge.test.mjs
