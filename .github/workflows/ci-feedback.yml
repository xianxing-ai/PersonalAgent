name: CI failure feedback
on:
  workflow_run:
    workflows: [Foundation]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: ci-feedback-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  notify-author:
    if: github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Notify the original PR author once per failed attempt
        run: node scripts/ci/failure-feedback.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
