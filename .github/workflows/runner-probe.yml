name: Runner probe
on:
  # Enables reviewable pre-merge validation; only an explicitly pushed probe ref runs.
  push:
    branches: ['codex/ci-probe/**']
  workflow_dispatch:
    inputs:
      target:
        description: Select a standard GitHub-hosted Windows probe or explicit native acceptance
        required: true
        type: choice
        options: [windows-github, psec-strict, psec-strict-arm64]
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      source_sha256: ${{ steps.source.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: select
        env:
          PROBE_TARGET: ${{ inputs.target }}
        run: node scripts/ci/runner-probe.mjs
      - id: source
        if: contains(steps.select.outputs.matrix, 'self-hosted')
        run: node scripts/ci/source-transfer.mjs pack
      - uses: actions/upload-artifact@v4
        if: contains(steps.select.outputs.matrix, 'self-hosted')
        with:
          name: probe-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.source.outputs.directory }}
          retention-days: 1
          if-no-files-found: error
  probe:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      PA_PSEC_EXPECTED_ARCH: ${{ matrix.psecArchitecture || 'x64' }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.runner[0] != 'self-hosted'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: matrix.runner[0] == 'self-hosted'
        with:
          name: probe-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-transfer
      - name: Restore verified same-run source locally
        id: restore
        if: matrix.runner[0] == 'self-hosted'
        shell: pwsh
        env:
          CI_SOURCE_SHA256: ${{ needs.select.outputs.source_sha256 }}
        run: |
          node "$env:RUNNER_TEMP/ci-transfer/source-transfer.mjs" restore
          if ($LASTEXITCODE -ne 0) { throw 'Source restore failed' }
      - uses: actions/setup-node@v4
        if: matrix.runner[0] != 'self-hosted'
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.psecArchitecture || 'x64' }}
      - name: Verify real automatic resource admission
        working-directory: ${{ steps.restore.outputs.directory || github.workspace }}
        if: matrix.runner[0] == 'self-hosted'
        shell: pwsh
        run: ./scripts/ci/windows-admission.ps1
      - name: Run a short routing and toolchain probe
        if: matrix.psecStrict != true
        working-directory: ${{ steps.restore.outputs.directory || github.workspace }}
        shell: pwsh
        run: |
          if ((& git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Probe checkout mismatch' }
          node -e "const fs=require('fs');if(process.version!=='v'+fs.readFileSync('.node-version','utf8').trim())process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Node version mismatch' }
          $sdks = & dotnet --list-sdks
          if ($LASTEXITCODE -ne 0 -or -not ($sdks -match '^8\.0\.\d+\s')) { throw '.NET 8 SDK missing' }
          node --test scripts/ci/pr-route.test.mjs scripts/ci/check-result.test.mjs scripts/ci/runner-probe.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Routing regressions failed' }
          "Short probe only; runner_name=$env:RUNNER_NAME; SHA=$env:GITHUB_SHA. This is not a full CI pass." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Prepare exact strict PSEC acceptance inputs
        if: matrix.psecStrict == true && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ((& git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Acceptance checkout mismatch' }
          node -e "const fs=require('fs');if(process.version!=='v'+fs.readFileSync('.node-version','utf8').trim())process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native Node version mismatch' }
          node packages/coding-tools/native/host-architecture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native Node/dotnet/.NET 8 architecture preflight failed' }
          $nativeTemp = Join-Path $env:RUNNER_TEMP 'psec-native-temp'
          New-Item -ItemType Directory -Path $nativeTemp -Force | Out-Null
          $env:TEMP = $nativeTemp
          $env:TMP = $nativeTemp
          "TEMP=$nativeTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$nativeTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sdks = & dotnet --list-sdks
          if ($LASTEXITCODE -ne 0 -or -not ($sdks -match '^8\.0\.\d+\s')) { throw '.NET 8 SDK missing' }
          if ((& npm.cmd --version).Trim() -ne '11.12.1') {
            npm.cmd install --global npm@11.12.1
            if ($LASTEXITCODE -ne 0) { throw 'Required npm version unavailable' }
          }
          npm.cmd ci --foreground-scripts --loglevel=error
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
          node scripts/ci/windows-standard-token/build-psec-inputs.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Required dependency build failed' }
          $built = & node packages/coding-tools/native/build-helper.mjs --target-dir (Join-Path $env:RUNNER_TEMP 'psec-acceptance-helper')
          if ($LASTEXITCODE -ne 0) { throw 'Native helper build failed' }
          $helper = ($built -join "`n") | ConvertFrom-Json
          "PA_TEST_JOB_HOST_EXE=$($helper.helperPath)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ./scripts/ci/windows-standard-token/smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Standard token smoke failed' }
      - name: Require both real ordinary-user PSEC scenarios without skips
        if: matrix.psecStrict == true && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          & $env:PA_CI_CHECK_LAUNCHER --run-psec-acceptance
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always() && matrix.psecStrict == true && github.event_name == 'workflow_dispatch'
        with:
          name: psec-strict-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/psec-positive-acceptance
          if-no-files-found: warn
          retention-days: 7
